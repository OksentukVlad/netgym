# Test, build and publish the NetGym web version to GitHub Pages.
# One workflow so a deploy always follows passing tests on the same commit:
# test → build → deploy (deploy only for pushes to main). Actions are pinned by
# commit SHA; the token is read-only except in the deploy job, which gets only
# pages: write and id-token: write. No secrets or personal tokens are used.
name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: shell/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: shell/frontend
        run: npm ci
      - name: Install Playwright's Chromium
        working-directory: shell/frontend
        run: npx playwright install --with-deps chromium
      # CI is set by GitHub, so a missing browser fails the browser tests.
      - name: Fast test suite
        run: tools/test.sh

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: shell/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: shell/frontend
        run: npm ci
      - name: Build the web version
        run: tools/build-web.sh "$RUNNER_TEMP/site"
      - name: Leak scan of the tracked files and the site
        run: |
          mkdir "$RUNNER_TEMP/tracked"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/tracked"
          node tools/leak-scan.mjs --exceptions tools/leak-scan-exceptions.tsv "$RUNNER_TEMP/tracked" --artifact "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
